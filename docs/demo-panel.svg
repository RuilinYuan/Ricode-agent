<svg width="760" height="980" viewBox="0 0 760 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4F8CFF"/><stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .ui     { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .mono   { font-family: "Cascadia Code", Consolas, monospace; }
      .t-body { font-size: 13.5px; fill: #d4d7db; }
      .t-meta { font-size: 11px;   fill: #636b75; }
      .t-tool { font-size: 12px;   fill: #6ea8fe; font-weight: 600; }
      .t-arg  { font-size: 12px;   fill: #7d8590; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="760" height="980" fill="#0e1013"/>

  <!-- 面板 -->
  <g filter="url(#shadow)">
    <rect x="36" y="28" width="688" height="924" rx="12" fill="#16181c" stroke="#26292f"/>
  </g>

  <!-- 标题栏 -->
  <rect x="36" y="28" width="688" height="42" rx="12" fill="#1b1e23"/>
  <rect x="36" y="49" width="688" height="21" fill="#1b1e23"/>
  <g transform="translate(54,39)">
    <rect width="20" height="20" rx="5" fill="url(#logo)"/>
    <path d="M6.5 6 L3.5 10 L6.5 14" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M13.5 6 L16.5 10 L13.5 14" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M10.8 5.5 L9 11.2 H10.4 L9.6 14.5 L12 8.8 H10.6 Z" fill="white"/>
  </g>
  <text x="84" y="55" class="ui" font-size="13.5" font-weight="600" fill="#dcdee2">Ricode Agent</text>
  <circle cx="698" cy="49" r="2.5" fill="#5b616a"/><circle cx="687" cy="49" r="2.5" fill="#5b616a"/><circle cx="676" cy="49" r="2.5" fill="#5b616a"/>

  <!-- ══ 用户任务（主层级 ①）══ -->
  <rect x="286" y="90" width="420" height="56" rx="14" fill="#2563a8"/>
  <text x="302" y="113" class="ui" font-size="13.5" fill="#f2f5f8">写一个 TODO 命令行工具，支持添加 / 列出 /</text>
  <text x="302" y="134" class="ui" font-size="13.5" fill="#f2f5f8">完成任务，数据存 JSON 文件，带单元测试</text>

  <!-- 轮次分隔：弱化 -->
  <line x1="56" y1="182" x2="340" y2="182" stroke="#22262c"/>
  <line x1="420" y1="182" x2="704" y2="182" stroke="#22262c"/>
  <text x="380" y="186" text-anchor="middle" class="ui t-meta">Round 1</text>

  <!-- ══ 推理正文（主层级 ②，最大字号）══ -->
  <text x="56" y="212" class="ui t-body">我先设计任务数据模型并创建主程序，再补充测试。</text>

  <!-- ══ 工具卡片（次层级，紧凑、统一、低饱和）══ -->
  <!-- write_file 1 -->
  <rect x="56" y="226" width="648" height="36" rx="7" fill="#1a1d22" stroke="#26292f"/>
  <path d="M68 238 l5 6 l-5 6" stroke="#6ea8fe" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="82" y="249" class="mono t-tool">write_file</text>
  <text x="160" y="249" class="mono t-arg">todo.py</text>
  <text x="688" y="249" text-anchor="end" class="ui" font-size="11.5" fill="#4ba168">✓</text>

  <!-- write_file 2 -->
  <rect x="56" y="268" width="648" height="36" rx="7" fill="#1a1d22" stroke="#26292f"/>
  <path d="M68 280 l5 6 l-5 6" stroke="#6ea8fe" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="82" y="291" class="mono t-tool">write_file</text>
  <text x="160" y="291" class="mono t-arg">test_todo.py</text>
  <text x="688" y="291" text-anchor="end" class="ui" font-size="11.5" fill="#4ba168">✓</text>

  <!-- Round 2 -->
  <line x1="56" y1="332" x2="340" y2="332" stroke="#22262c"/>
  <line x1="420" y1="332" x2="704" y2="332" stroke="#22262c"/>
  <text x="380" y="336" text-anchor="middle" class="ui t-meta">Round 2</text>

  <!-- run_tests 失败（唯一红色焦点） -->
  <rect x="56" y="348" width="648" height="132" rx="7" fill="#1a1d22" stroke="#a8453c" stroke-opacity="0.55"/>
  <path d="M68 360 l5 6 l-5 6" stroke="#6ea8fe" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="82" y="371" class="mono t-tool">run_tests</text>
  <text x="152" y="371" class="mono t-arg">pytest . -v</text>
  <text x="688" y="371" text-anchor="end" class="ui" font-size="11.5" fill="#e06c60">✗ 2 failed</text>
  <line x1="56" y1="382" x2="704" y2="382" stroke="#26292f"/>
  <text x="72" y="404" class="mono" font-size="11.5" fill="#8b949e">test_add_task <tspan fill="#4ba168">PASSED</tspan>  ·  test_done_task <tspan fill="#e06c60">FAILED</tspan></text>
  <text x="72" y="426" class="mono" font-size="11.5" fill="#e06c60">AttributeError: 'dict' object has no attribute 'strip'</text>
  <text x="72" y="446" class="mono" font-size="11.5" fill="#636b75">  File "todo.py", line 47, in mark_done</text>
  <text x="72" y="466" class="mono" font-size="11.5" fill="#8b949e">2 failed, 5 passed in 0.42s</text>

  <!-- 推理正文 -->
  <text x="56" y="512" class="ui t-body">根因：mark_done 从 JSON 读出的是 dict，却按字符串处理。</text>
  <text x="56" y="534" class="ui t-body">改为按 id 定位任务后再更新状态字段。</text>

  <!-- Round 3 -->
  <line x1="56" y1="558" x2="340" y2="558" stroke="#22262c"/>
  <line x1="420" y1="558" x2="704" y2="558" stroke="#22262c"/>
  <text x="380" y="562" text-anchor="middle" class="ui t-meta">Round 3</text>

  <rect x="56" y="574" width="648" height="36" rx="7" fill="#1a1d22" stroke="#26292f"/>
  <path d="M68 586 l5 6 l-5 6" stroke="#6ea8fe" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="82" y="597" class="mono t-tool">write_file</text>
  <text x="160" y="597" class="mono t-arg">todo.py · 修复 mark_done</text>
  <text x="688" y="597" text-anchor="end" class="ui" font-size="11.5" fill="#4ba168">✓</text>

  <rect x="56" y="616" width="648" height="36" rx="7" fill="#1a1d22" stroke="#3f7d4e" stroke-opacity="0.5"/>
  <path d="M68 628 l5 6 l-5 6" stroke="#6ea8fe" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="82" y="639" class="mono t-tool">run_tests</text>
  <text x="152" y="639" class="mono t-arg">pytest . -v</text>
  <text x="688" y="639" text-anchor="end" class="ui" font-size="11.5" fill="#4ba168">✓ 7 passed</text>

  <!-- 系统事件：最小层级，灰 -->
  <text x="56" y="682" class="ui t-meta">上下文压缩 L1 · 节省 8,240 tokens</text>

  <!-- ══ 结果（成功焦点，绿）══ -->
  <text x="56" y="722" class="ui" font-size="14" font-weight="600" fill="#4ba168">✔ 任务完成 — 生成 todo.py + test_todo.py，7 项测试全部通过</text>
  <text x="56" y="746" class="ui t-meta">3 轮 · tokens 45,210 ↑ / 8,140 ↓ · 沙箱 docker · 循环告警 0</text>

  <!-- 输入区 -->
  <rect x="36" y="792" width="688" height="160" fill="#1b1e23"/>
  <line x1="36" y1="792" x2="724" y2="792" stroke="#26292f"/>
  <rect x="56" y="812" width="648" height="58" rx="9" fill="#121417" stroke="#33373f"/>
  <text x="72" y="847" class="ui" font-size="12.5" fill="#5b616a">描述编程任务，Enter 发送，Shift+Enter 换行</text>
  <rect x="628" y="828" width="60" height="26" rx="6" fill="#2563a8"/>
  <text x="658" y="845" text-anchor="middle" class="ui" font-size="12" fill="#eef2f6">发送</text>
  <text x="56" y="896" class="ui t-meta"><tspan fill="#4ba168">●</tspan> 后端已就绪 · sandbox: docker · RAG 索引 126 chunks</text>
</svg>
